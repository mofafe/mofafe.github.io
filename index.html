<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mofafe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .desktop-grid {
        padding: 24px;

        display: grid;

        width: 100vw;
        height: 100vh;

        gap: 36px;

        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }

      .tile {
        padding: 12px;

        display: flex;

        text-decoration: none;
        color: inherit;

        border-radius: 24px;

        border: 9px solid;

        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);

        transition: 0.2s;
      }

      .tile:hover {
        transform: translateY(-4px);
      }

      .tile.about {
        border-color: aquamarine;
      }

      .tile h2 {
        font-size: 3rem;
      }

      body {
        overflow: hidden;
      }

      .curtain {
        position: fixed;
        top: 0;
        width: 50vw;
        height: 100vh;

        background: #111;

        z-index: 9999;

        animation-duration: 1.2s;
        animation-delay: 2s;
        animation-timing-function: cubic-bezier(0.77, 0, 0.18, 1);
        animation-fill-mode: forwards;
      }

      .curtain-left {
        left: 0;
        animation-name: open-left;
      }

      .curtain-right {
        right: 0;
        animation-name: open-right;
      }

      @keyframes open-left {
        to {
          transform: translateX(-100%);
        }
      }

      @keyframes open-right {
        to {
          transform: translateX(100%);
        }
      }

      .intro {
        color: skyblue;

        position: fixed;
        inset: 0;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        z-index: 10000;
      }

      .intro span {
        display: inline-block;

        opacity: 0;

        transform: translateY(-100px);

        animation: drop 0.6s forwards;

        animation-delay: calc(var(--i) * 0.15s);
      }

      @keyframes drop {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  <body>
    <div class="intro">
      <h1>
        <span style="--i: 0">m</span>
        <span style="--i: 1">o</span>
        <span style="--i: 2">f</span>
        <span style="--i: 3">a</span>
        <span style="--i: 4">f</span>
        <span style="--i: 5">e</span>
      </h1>

      <p>のサイトへようこそ</p>
    </div>

    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <main class="desktop-grid">
      <a class="tile about">
        <div class="content">
          <h2>About</h2>
          <p>にわかプログラマー、にわかDTMer。</p>
        </div>
      </a>
      <a class="tile programming">
        <div class="content">
          <h2>Programming</h2>
          <p>
            自分が作りたいものをたまに作る、飽きっぽいので完成品はまだない。
          </p>
        </div>
      </a>
      <a class="tile music">
        <div class="content">
          <h2>Music</h2>
          <p>興味はあるし、やってて楽しいけど、まだ完成は遠そう。</p>
        </div>
      </a>
      <a class="tile novel">
        <div class="content">
          <h2>Novel</h2>
          <p>
            文章書くのは楽しいけど、数年後黒歴史になるのが怖くて、なかなか書けない。小説って黒歴史の代名詞みたいなとこある()
          </p>
        </div>
      </a>
      <a class="tile archive">
        <div class="content">
          <h2>Archive</h2>
          <p>今まで僕が作ったものたち。と言いながらまだない。</p>
        </div>
      </a>
      <a class="tile links">
        <div class="content">
          <h2>Links</h2>
          <p>SNSアカウントたち。</p>
        </div>
      </a>
    </main>
  </body>
</html>
